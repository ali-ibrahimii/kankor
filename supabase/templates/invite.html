<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">
</head>

<body style="margin: 0; padding: 0;">
    <table style="background-color: rgb(1, 1, 51); width: 100%;">
        <tbody>
            <tr>
                <td style="padding: 25px 0;"></td>
            </tr>
            <tr>
                <td align="center"
                    style='padding: 0 10px; font-family:"Nunito Sans",Helvetica,Arial,sans-serif;font-size:16px'>
                    <table width="100%" border="0" cellpadding="0" cellspacing="0"
                        style="max-width: 570px; margin: 0 auto; background-color: #ffffff; font-family:Arial,'Helvetica Neue',Helvetica,sans-serif; overflow: hidden; border: 1px solid #e0e0e0;">
                        <tbody>
                            <tr>
                                <td style="padding: 20px;">
                                    <table width="100%" border="0" cellpadding="0" cellspacing="0">
                                        <tbody>

                                            <tr>
                                                <td>
                                                    <table style="width: 100%; padding: 20px;">
                                                        <tbody>
                                                            <tr>
                                                                <td>
                                                                    <div style="max-width:132px;">
                                                                        <a href="https://www.abzarkankor.com"
                                                                            target="_blank">
                                                                            <img src="https://storage.googleapis.com/abzarkankorv2.firebasestorage.app/logos/typo_blue.png"
                                                                                width="auto" alt="Abzar Kankor"
                                                                                title="Abzar Kankor" height="33"></a>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                            <tr>
                                                                <td
                                                                    style='font-family:"Nunito Sans",Helvetica,Arial,sans-serif;font-size:16px;'>
                                                                    <div
                                                                        style="padding-bottom: 10px; padding-top: 20px;">
                                                                        <h3
                                                                            style="padding: 0; margin-top: 0; font-size: 22px;">
                                                                            You’re invited to Abzar Kankor 🚀
                                                                        </h3>
                                                                        <p
                                                                            style='margin:0.4em 0 1.1875em;font-size:16px;line-height:1.625;color:#51545e'>
                                                                            You’ve been invited to join a workspace on
                                                                            Abzar Kankor — an AI-powered content
                                                                            automation platform.
                                                                        </p>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                            <tr>
                                                                <td align="center">
                                                                    <div style="margin-bottom: 20px;">
                                                                        <a href="{{ .SiteURL }}/api/auth/callback?token_hash={{ .TokenHash }}&type=email&next=/auth/reset-password"
                                                                            style="color:#ffffff;background-color:#3869d4;border-top:10px solid #3869d4;border-right:18px solid #3869d4;border-bottom:10px solid #3869d4;border-left:18px solid #3869d4;display:inline-block;text-decoration:none;border-radius:3px;box-sizing:border-box">Accept
                                                                            invitation</a>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                            <tr>
                                                                <td
                                                                    style="font-size:1px;line-height:1px;border-top:1px solid #dcdcdc; padding-bottom: 20px;">
                                                                    <span style="word-break: break-word;">&#8202;</span>
                                                                </td>
                                                            </tr>
                                                            <tr>
                                                                <td>
                                                                    <div
                                                                        style="color:#8a8a8a;direction:ltr;font-size:14px;font-weight:400;letter-spacing:0;line-height:1.2;text-align:left;">
                                                                        <p>
                                                                            If you weren’t expecting this invite, you
                                                                            can safely ignore this email.
                                                                        </p>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        </tbody>
                                                    </table>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <table align="center" width="100%" cellpadding="0" cellspacing="0" role="presentation"
                        style="max-width: 570px; margin: 0 auto; padding: 0; text-align: center;">
                        <tbody>
                            <tr>
                                <td align="center"
                                    style='font-family: "Nunito Sans", Helvetica, Arial, sans-serif; font-size: 16px; padding: 20px 0;'>
                                    <p
                                        style="margin: 0; font-size: 13px; line-height: 1.625; color: #a8aaaf; text-align: center;">
                                        &copy; 2026 Abzar Kankor. All rights reserved.
                                    </p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            </tr>
            <tr>
                <td style="padding: 25px 0;"></td>
            </tr>
        </tbody>
    </table>
</body>

</html>
